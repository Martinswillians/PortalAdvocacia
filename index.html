<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAB | Portal dos Advogados do Brasil</title>
<meta name="description" content="PAB – Portal dos Advogados do Brasil: site pessoal para cada advogado, comunicados e atualizações do portal.">
<meta name="theme-color" content="#0b1726">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PAB">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1726;--navy2:#13243a;--gold:#c9a84c;--gold2:#e8c97a;--cream:#f6f2ea;--muted:#8d98a8;--on-gold:#0b1726;--border:rgba(201,168,76,.22);--ok:#3aa57d;--warn:#d99a2b;--info:#3a8dde;--bad:#d1495b;--purple:#9b6bd1}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;font-weight:300;background:var(--navy);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:400}
a{color:var(--gold)}button{font-family:inherit;cursor:pointer}
.eyebrow{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.wrap{max-width:1120px;margin:auto;padding:0 1.4rem}
/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,23,38,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hdr-in{max-width:1120px;margin:auto;padding:.8rem 1.4rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit}
.brand img{width:38px;height:38px;border-radius:9px}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--gold);letter-spacing:.08em;line-height:1;font-weight:600}
.brand small{display:block;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px;max-width:170px;line-height:1.3}
.hdr nav{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap;align-items:center}
.hdr nav a,.hdr nav button{background:none;border:none;color:var(--cream);text-decoration:none;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.55rem .8rem;border-bottom:2px solid transparent;opacity:.85}
.hdr nav a:hover,.hdr nav button:hover{color:var(--gold);opacity:1}
.hdr nav a.on{color:var(--gold);border-bottom-color:var(--gold);opacity:1}
.hdr nav a.cta{border:1px solid var(--gold);color:var(--gold)}
.sub-nav{max-width:1120px;margin:auto;padding:0 1.4rem;display:flex;gap:.2rem;overflow-x:auto}
.sub-nav a{padding:.7rem 1rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
.sub-nav a:hover{color:var(--cream)}.sub-nav a.on{color:var(--gold);border-bottom-color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
main{min-height:70vh}
.pad{padding-top:2.2rem;padding-bottom:4.5rem}
footer.ft{border-top:1px solid var(--border);padding:1.6rem 1.4rem 2.4rem;text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:.06em;line-height:1.9}
footer.ft button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:inherit}
/* botões / campos */
.btn{display:inline-block;background:var(--gold);color:var(--on-gold);border:1px solid var(--gold);padding:.8rem 1.5rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--border)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{padding:.5rem .9rem;font-size:.6rem}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{background:transparent;border:1px solid var(--border);color:var(--cream);padding:.7rem .8rem;font:inherit;font-size:.86rem;font-weight:400;outline:none;width:100%;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--gold)}
.field select option,.toolbar select option{background:var(--navy2);color:var(--cream)}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field small,.hint{font-size:.66rem;color:var(--muted);line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.74rem;line-height:1.55;color:var(--muted);margin-bottom:1rem;cursor:pointer}
.check{color:var(--cream);align-items:center;border:1px solid var(--border);padding:.8rem .9rem}
.check input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--gold);background:transparent;cursor:pointer;position:relative;border-radius:4px}
.check input:checked{background:var(--gold)}
.check input:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:18px;font-weight:700;line-height:1}
.check:has(input:checked){border-color:var(--gold)}
.msg-err{color:var(--bad);font-size:.75rem;min-height:1.1rem;margin-bottom:.6rem}.msg-ok{color:var(--ok);font-size:.75rem;margin-bottom:.6rem}
.card{border:1px solid var(--border);background:var(--navy2);padding:1.5rem}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.page-h h1{font-size:2.2rem;line-height:1.1}.page-h h1 em{color:var(--gold)}.page-h p{font-size:.78rem;color:var(--muted);margin-top:.35rem;max-width:620px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.6rem}
.stat{border:1px solid var(--border);background:var(--navy2);padding:1rem 1.1rem;text-decoration:none;color:inherit;display:block}
a.stat:hover{border-color:var(--gold)}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:400;color:var(--gold);line-height:1}
.stat span{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;padding:.16rem .6rem;border-radius:20px;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid currentColor;white-space:nowrap}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-info{color:var(--info)}.s-bad{color:var(--bad)}.s-mute{color:var(--muted)}.s-purple{color:var(--purple)}
.empty{text-align:center;padding:2.6rem 1rem;color:var(--muted);font-size:.82rem;line-height:1.7;border:1px dashed var(--border)}
.empty b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--cream);margin-bottom:.3rem}
.sec-t{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:1.8rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
.list{display:flex;flex-direction:column;gap:.6rem}
.item{border:1px solid var(--border);background:var(--navy2);padding:1rem 1.2rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.item .main{flex:1;min-width:200px}.item h3{font-size:1.2rem;line-height:1.2;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.item p{font-size:.72rem;color:var(--muted);margin-top:.2rem;line-height:1.55;word-break:break-word}
.item .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.on-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(58,165,125,.2)}
.off-dot{width:9px;height:9px;border-radius:50%;background:#4a5668;display:inline-block}
/* avisos */
.board{display:flex;flex-direction:column;gap:.8rem}
.aviso{border:1px solid var(--border);border-left:4px solid var(--info);background:var(--navy2);padding:1rem 1.2rem}
.aviso.alerta{border-left-color:var(--bad)}.aviso.publicacao{border-left-color:var(--gold)}.aviso.atualizacao{border-left-color:var(--ok)}
.aviso .t{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.35rem;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.aviso h4{font-size:1.3rem;margin-bottom:.3rem;line-height:1.25}
.aviso p{font-size:.82rem;line-height:1.7;color:var(--cream);font-weight:300}
.aviso .lk{display:inline-block;margin-top:.5rem;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase}
.pin{color:var(--gold)}
/* home */
.hero{position:relative;padding:5.5rem 0 4rem;background:radial-gradient(ellipse 70% 60% at 75% 30%,rgba(201,168,76,.1),transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2) 55%,var(--navy))}
.hero h1{font-size:clamp(2.4rem,5.5vw,4.4rem);line-height:1.02;max-width:760px}.hero h1 em{color:var(--gold)}
.hero p.lead{margin-top:1.4rem;max-width:560px;font-size:.92rem;line-height:1.9;color:var(--muted)}
.hero .ctas{margin-top:2.2rem;display:flex;gap:.9rem;flex-wrap:wrap}
.hero .seal{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:clamp(120px,16vw,220px);opacity:.14;color:var(--gold)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:.5rem}
.feat div{background:var(--navy);padding:2rem 1.6rem}.feat span{font-size:1.6rem}.feat h3{font-size:1.4rem;margin:.6rem 0 .5rem}.feat p{font-size:.8rem;line-height:1.8;color:var(--muted)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.dcard{border:1px solid var(--border);background:var(--navy2);padding:1.3rem;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:.7rem;transition:border-color .2s,transform .2s}
.dcard:hover{border-color:var(--gold);transform:translateY(-3px)}
.dcard .top{display:flex;gap:.9rem;align-items:center}
.ph{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--navy);border:1px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--gold)}
.dcard h3{font-size:1.25rem;line-height:1.2}.dcard small{font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.tags{display:flex;gap:.3rem;flex-wrap:wrap}.tags span{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border);padding:.15rem .5rem;color:var(--muted)}
/* auth */
.auth-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:start}
.auth-grid .card{position:sticky;top:5.5rem}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.3rem}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:.8rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.gbtn{width:100%;display:flex;gap:.6rem;align-items:center;justify-content:center;background:#fff;color:#222;border:none;padding:.75rem;font-size:.78rem;font-weight:500;margin-bottom:1rem}
.or{display:flex;align-items:center;gap:.8rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
/* painel */
.status-b{border:1px solid var(--warn);background:rgba(217,154,43,.08);padding:1.2rem 1.4rem;margin-bottom:1.4rem;font-size:.84rem;line-height:1.7}
.status-b.bad{border-color:var(--bad);background:rgba(209,73,91,.08)}.status-b.ok{border-color:var(--ok);background:rgba(58,165,125,.08)}
.status-b b{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;display:block;margin-bottom:.2rem}
.areas-ed{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.8rem}
.areas-ed .r{display:grid;grid-template-columns:1fr 2fr auto;gap:.5rem;align-items:start}
.areas-ed input,.areas-ed textarea{background:transparent;border:1px solid var(--border);color:var(--cream);padding:.55rem .7rem;font:inherit;font-size:.82rem;width:100%;outline:none}
.areas-ed textarea{min-height:44px;resize:vertical}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
.themes label{border:1px solid var(--border);padding:.5rem;cursor:pointer;display:flex;flex-direction:column;gap:.4rem;font-size:.66rem;letter-spacing:.06em}
.themes input{display:none}.themes label:has(input:checked){border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.themes i{display:flex;height:22px;border:1px solid rgba(128,128,128,.4)}.themes i u{flex:1}
.photo-row{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}.photo-row .ph{width:84px;height:84px}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:120px;margin-top:.6rem}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3rem;height:100%;font-size:.6rem;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--gold);min-height:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pnl{border:1px solid var(--border);background:var(--navy2);padding:1.1rem 1.2rem}
.pnl h3{font-family:'Montserrat',sans-serif;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:.8rem}
.mini{display:flex;flex-direction:column}.mini>*{display:flex;justify-content:space-between;gap:.8rem;font-size:.78rem;padding:.55rem 0;border-bottom:1px solid var(--border);color:var(--cream);text-decoration:none;align-items:center}
.mini small{color:var(--muted);font-size:.66rem;text-align:right}.mini .none{color:var(--muted);border:none}
/* modal / toast */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto}
.modal{background:var(--navy);border:1px solid var(--gold);width:100%;max-width:580px;padding:1.8rem;position:relative;margin:auto}
.modal h2{font-size:1.8rem;margin-bottom:1rem}.modal .x{position:absolute;top:.6rem;right:.9rem;background:none;border:none;color:var(--muted);font-size:1.2rem}
.modal .acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.8rem}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--on-gold);padding:.8rem 1.4rem;font-size:.78rem;font-weight:500;z-index:200;opacity:0;transition:.3s;max-width:90vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--bad);color:#fff}
.loading{text-align:center;padding:6rem 1rem;color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
/* site pessoal */
.site{--sb:#0d1821;--sb2:#162030;--sa:#c9a84c;--st:#f8f5ef;--sm:#8a8070;--sl:color-mix(in srgb,var(--sa) 25%,transparent);background:var(--sb);color:var(--st);min-height:100vh;font-family:'Montserrat',sans-serif;font-weight:300;position:relative}
.site a{color:var(--sa)}.site [id^="s-"]{scroll-margin-top:74px}
.site .bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 1.4rem;background:rgba(0,0,0,.35);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
.site .bar a{color:var(--st);text-decoration:none;opacity:.8}.site .bar a:hover{opacity:1;color:var(--sa)}
.site .prev{background:var(--sa);color:var(--sb);text-align:center;padding:.5rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.site nav.sn{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.6rem;background:color-mix(in srgb,var(--sb) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--sl)}
.site .sn .lg{font-family:'Cormorant Garamond',serif;color:var(--sa);font-size:1.7rem;font-weight:600;line-height:1;letter-spacing:.06em;text-decoration:none}
.site .sn .lg small{display:block;font-family:'Montserrat',sans-serif;font-size:.5rem;letter-spacing:.3em;color:var(--st);opacity:.75;margin-top:4px;font-weight:300}
.site .sn ul{list-style:none;display:flex;gap:1.6rem;align-items:center}
.site .sn ul a{color:var(--st);text-decoration:none;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.site .sn ul a:hover{color:var(--sa);opacity:1}
.site .sn .tg{display:none;width:48px;height:48px;border:1px solid var(--sl);background:transparent;color:var(--st);flex-direction:column;gap:6px;align-items:center;justify-content:center}
.site .sn .tg i{display:block;width:22px;height:2px;background:currentColor}
.site .hero2{position:relative;overflow:hidden;padding:6rem 1.6rem 5rem;background:radial-gradient(ellipse 70% 60% at 80% 20%,color-mix(in srgb,var(--sa) 12%,transparent),transparent 60%),linear-gradient(160deg,var(--sb),var(--sb2) 70%,var(--sb))}
.site .hero2.cv{background-size:cover;background-position:center}
.site .hero2 .dim{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--sb) 92%,transparent),color-mix(in srgb,var(--sb) 55%,transparent))}
.site .hero2 .in{position:relative;max-width:1000px;margin:auto}
.site .pre{display:flex;gap:1rem;align-items:center;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sa);margin-bottom:1.4rem}
.site .pre::before{content:'';flex:none;width:46px;height:1px;background:var(--sa)}
.site .hero2 h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(3rem,10vw,6rem);line-height:.98}
.site .hero2 h1 em{color:var(--sa);display:block}
.site .tag{margin-top:1.6rem;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sm);max-width:640px;line-height:1.9}
.site .ctas{margin-top:2.2rem;display:flex;gap:.9rem;flex-wrap:wrap}
.site .b1,.site .b2{padding:1rem 1.7rem;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;font-weight:600;display:inline-block}
.site .b1{background:var(--sa);color:var(--sb)}.site .b2{border:1px solid var(--sl);color:var(--st)}.site .b2:hover{border-color:var(--sa);color:var(--sa)}
.site .deco{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:clamp(140px,22vw,300px);color:var(--sa);opacity:.12}
.site .intro{max-width:1000px;margin:auto;padding:4.5rem 1.6rem;display:grid;grid-template-columns:.9fr 1.1fr;gap:3.5rem;align-items:center}
.site .ph2{position:relative;aspect-ratio:4/5;background:var(--sb2);border:1px solid var(--sl);overflow:hidden;display:flex;align-items:center;justify-content:center}
.site .ph2 img{width:100%;height:100%;object-fit:cover;display:block}.site .ph2 .ini{font-family:'Cormorant Garamond',serif;font-size:6rem;color:var(--sa)}
.site .ph2 .cap{position:absolute;left:1.2rem;bottom:1.2rem;right:1.2rem;border-left:3px solid var(--sa);padding:.3rem 0 .3rem 1rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.site .ph2 .cap h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.6rem;color:#fff}.site .ph2 .cap p{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sa)}
.site .eb{display:flex;gap:1rem;align-items:center;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sa);margin-bottom:1rem}
.site .eb::after{content:'';flex:none;width:46px;height:1px;background:var(--sa)}.site .eb.c{justify-content:center}
.site h2.hd{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.1;margin-bottom:1.4rem}.site h2.hd em{color:var(--sa)}
.site .tx p{font-size:.92rem;line-height:2;opacity:.82;margin-bottom:1rem}
.site .oab{display:inline-flex;gap:1rem;align-items:center;border:1px solid var(--sl);padding:1rem 1.4rem;margin-top:1rem}

function statusBanner() {

  if (a.status === 'suspenso') return `<div class="status-b bad"><b>Acesso suspenso</b>${a.motivo ? esc(a.motivo) + '<br>' : ''}Entre em contato com o PAB: <a href="mailto:${esc(S.config.suporteEmail)}">${esc(S.config.suporteEmail)}</a>. Seu site está fora do ar.</div>`;

  return '';
}

  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); let sx = 0, sy = 0, sw = img.width, sh = img.height;

      else { const k = Math.min(1, w / img.width); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); }
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => rej(new Error('Não foi possível ler esta imagem.')); img.src = u; });
}

function baixaIcs(e) {

  else l = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${dayKey(new Date(e.data + 'T12:00:00').getTime() + 864e5).replace(/-/g, '')}`];
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PAB//Portal//PT', 'BEGIN:VEVENT', 'UID:' + e.id + '@aab', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]|\.\d+/g, ''), ...l, 'SUMMARY:' + esc2(e.titulo), e.local ? 'LOCATION:' + esc2(e.local) : '', e.notas ? 'DESCRIPTION:' + esc2(e.notas) : '', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');

    S.view = a === 'processo' && b2 ? viewClienteProc(main, b2) : a === 'agenda' ? viewClienteAgenda(main) : a === 'mensagens' ? viewClienteMsgs(main) : a === 'documentos' ? viewClienteDocs(main) : a === 'perfil' ? viewClientePerfil(main) : viewClienteHome(main);

    const mine = c => query(collection(db, c), where('advogadoUid', '==', uid));
    listen(mine('clientes'), s => { S.cli = docs(s); onData(); }); listen(mine('processos'), s => { S.proc = docs(s); onData(); });
    listen(mine('eventos'), s => { S.ev = docs(s); onData(); }); listen(mine('documentos'), s => { S.dc = docs(s); onData(); }); listen(mine('chats'), s => { S.chats = docs(s); onData(); }); listen(mine('tarefas'), s => { S.tar = docs(s); onData(); });
    S.hb = setInterval(() => { if (document.visibilityState === 'visible' && S.assoc) updateDoc(doc(db, 'associados', uid), { visto: serverTimestamp() }).catch(() => {}); }, 5 * 60e3);
  }
}
async function boot() {
  const watchdog = setTimeout(() => { if (!S.routed) { S.routed = true; try { route(); } catch (e) { console.error(e); } } }, 7000);
  try { const c = await withTimeout(getDoc(doc(db, 'config', 'portal')), 4000); if (c.exists()) S.config = { ...DEF, ...c.data() }; } catch { /* usa o padrão */ }
  publicListeners();
  onAuthStateChanged(auth, user => {
    stopAll(); S.user = user; S.admin = false; S.assoc = null; S.site = null; S.msgs = []; S.arts = []; S.insc = []; S.cli = []; S.proc = []; S.ev = []; S.tar = []; S.dc = []; S.chats = []; S.chat = null; S.cliente = null; S.roleLoading = false; S.associados = []; S.logins = []; S.sites = []; S.com = [];
    S.popupPending = false;
    if (user) { S.admin = (user.email || '').toLowerCase() === ADMIN_EMAIL; if (S.admin) attach(user); else S.roleLoading = true; }
    else listen(query(collection(db, 'comunicados'), where('ativo', '==', true), where('publico', '==', true)), s => { S.com = docs(s); onData(); });
    clearTimeout(watchdog); S.routed = true;
    try { route(); } catch (e) { console.error(e); $('#root').innerHTML = '<div class="wrap pad"><div class="empty"><b>Erro ao carregar</b>Atualize a página. Se persistir, limpe os dados do site no navegador.</div></div>'; }
    if (user) (async () => {
      if (!S.admin) {
        // quem tem cadastro de associado é advogado; quem só tem cadastro de cliente entra na Área do cliente
        try { const a = await withTimeout(getDoc(doc(db, 'associados', user.uid)), 8000); if (!a.exists()) { const c = await withTimeout(getDoc(doc(db, 'clientes', user.uid)), 8000); if (c.exists()) S.cliente = { id: c.id, ...c.data() }; } } catch (e) { console.warn('papel', e.code || e.message); }
        if (auth.currentUser?.uid !== user.uid) return;
        S.roleLoading = false; attach(user); try { route(); } catch (e) { console.error(e); }
        if (S.cliente) return;
      }
      try { if (!S.admin) await ensureAssoc(user); } catch (e) { console.warn('cadastro', e.code); toast(errMsg(e), true); }
      const first = await logAccess(user);
      if (first && auth.currentUser?.uid === user.uid && !S.admin) { if (S.comLoaded) showPopups(); else S.popupPending = true; }
    })();
  });
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#instBtn'); if (b) b.hidden = false; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
boot();
</script>
