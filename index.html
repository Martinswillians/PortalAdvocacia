.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.74rem;line-height:1.55;color:var(--muted);margin-bottom:1rem;cursor:pointer}

.msg-err{color:var(--bad);font-size:.75rem;min-height:1.1rem;margin-bottom:.6rem}.msg-ok{color:var(--ok);font-size:.75rem;margin-bottom:.6rem}

a.stat:hover{border-color:var(--gold)}

.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-info{color:var(--info)}.s-bad{color:var(--bad)}.s-mute{color:var(--muted)}.s-purple{color:var(--purple)}

.auth-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:start}
.auth-grid .card{position:sticky;top:5.5rem}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.3rem}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:.8rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.gbtn{width:100%;display:flex;gap:.6rem;align-items:center;justify-content:center;background:#fff;color:#222;border:none;padding:.75rem;font-size:.78rem;font-weight:500;margin-bottom:1rem}
.or{display:flex;align-items:center;gap:.8rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}

.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.site .ct{display:grid;grid-template-columns:1fr 1.2fr;gap:3rem}
.site .ci{display:flex;flex-direction:column;gap:1rem;font-size:.86rem}.site .ci a{text-decoration:none}.site .ci small{display:block;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sm);margin-bottom:.15rem}

.site .fi input:focus,.site .fi textarea:focus{border-bottom-color:var(--sa)}.site .fi textarea{height:90px;resize:none}
.site .fi button{background:var(--sa);color:var(--sb);border:none;padding:.9rem 2rem;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;align-self:flex-start}
.site .fo{padding:2rem 1.4rem;text-align:center;font-size:.64rem;letter-spacing:.1em;color:var(--sm);border-top:1px solid color-mix(in srgb,var(--sa) 25%,transparent)}
.site .prev{background:var(--sa);color:var(--sb);text-align:center;padding:.5rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
@media(max-width:800px){
 .row2,.row3,.dgrid,.auth-grid,.site .ct{grid-template-columns:1fr}.feat{grid-template-columns:1fr}
 .auth-grid .card{position:static}.hero{padding:3.5rem 0 3rem}.hero .seal{display:none}.page-h h1{font-size:1.8rem}

 .hdr nav{margin-left:0;width:100%}
}

function reduzFoto(file) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const n = 360, c = document.createElement('canvas'); c.width = c.height = n; const l = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - l) / 2, (img.height - l) / 2, l, l, 0, 0, n, n); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => rej(new Error('Não foi possível ler esta imagem.')); img.src = u; });
}

    await updateDoc(doc(db, 'associados', uid), { status, motivo, ...(status === 'ativo' ? { aprovadoAt: serverTimestamp(), aprovadoPor: ADMIN_EMAIL } : {}) });
    if (a.siteSlug) {
      if (status === 'ativo') await updateDoc(doc(db, 'sites', a.siteSlug), { bloqueado: false });
      else await updateDoc(doc(db, 'sites', a.siteSlug), { publicado: false, bloqueado: true });
    }
    toast(status === 'ativo' ? `${a.nome} aprovado(a).` : 'Status atualizado.');
  } catch (e) { toast(errMsg(e), true); }
}
function viewAdminAssoc(main) {
  let q = '', st = '';
  main.innerHTML = `<div class="wrap pad"><div class="page-h"><div><div class="eyebrow">Gestão</div><h1><em>Associados</em></h1><p>Aprove cadastros, suspenda acessos e veja quem está usando o portal.</p></div></div>
  <div class="toolbar"><input id="q" placeholder="Buscar por nome, e-mail ou OAB…"><select id="st"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></div><div class="list" id="ls"></div></div>`;
  const draw = () => {
    const t = q.toLowerCase(), l = S.associados.filter(a => (!st || a.status === st) && (!t || [a.nome, a.email, a.oab].join(' ').toLowerCase().includes(t))).sort((a, b) => (a.status === 'pendente' ? 0 : 1) - (b.status === 'pendente' ? 0 : 1) || ms(b.criadoAt) - ms(a.criadoAt));
    $('#ls', main).innerHTML = l.length ? l.map(a => { const s = STATUS[a.status] || STATUS.pendente, site = S.sites.find(x => x.id === a.siteSlug);
      return `<div class="item"><div class="main"><h3><span class="${online(a) ? 'on-dot' : 'off-dot'}" title="${online(a) ? 'Online agora' : 'Offline'}"></span>${esc(a.nome)} <span class="chip ${s[1]}">${s[0]}</span>${site ? `<span class="chip ${site.publicado ? 's-ok' : 's-mute'}">${site.publicado ? 'site no ar' : 'site rascunho'}</span>` : ''}</h3>
      <p>${esc(a.email)} · OAB ${esc(a.oab || '—')}${a.seccional ? '/' + esc(a.seccional) : ''} · ${esc(a.telefone || '')}<br>Cadastro: ${fmtD(a.criadoAt)} · Último acesso: ${a.ultimoAcesso ? fmtDT(a.ultimoAcesso) + ' (' + ago(a.ultimoAcesso) + ')' : 'nunca'} · ${a.acessos || 0} acesso(s)${a.motivo ? '<br>Motivo: ' + esc(a.motivo) : ''}</p></div>
      <div class="acts" data-u="${a.id}">${a.status !== 'ativo' ? '<button class="btn sm" data-a="ok">Aprovar</button>' : ''}${a.status === 'pendente' ? '<button class="btn danger sm" data-a="rec">Recusar</button>' : ''}${a.status === 'ativo' ? '<button class="btn danger sm" data-a="sus">Suspender</button>' : ''}${site ? `<a class="btn ghost sm" href="#/a/${esc(site.id)}" target="_blank">Ver site</a>` : ''}<button class="btn ghost sm" data-a="pw">Link de senha</button><button class="btn danger sm" data-a="del">Excluir</button></div></div>`; }).join('')
      : '<div class="empty"><b>Nenhum associado encontrado</b></div>';
  };
  $('#q', main).oninput = e => { q = e.target.value; draw(); }; $('#st', main).onchange = e => { st = e.target.value; draw(); };
  main.onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const uid = b.closest('[data-u]').dataset.u, a = S.associados.find(x => x.id === uid); if (!a) return;
    if (b.dataset.a === 'ok') mudaStatus(uid, 'ativo');
    else if (b.dataset.a === 'sus' || b.dataset.a === 'rec') { const m = await askText(b.dataset.a === 'sus' ? 'Suspender acesso' : 'Recusar cadastro', 'Informe o motivo (o associado verá esta mensagem). O site, se existir, sai do ar.', b.dataset.a === 'sus' ? 'Suspender' : 'Recusar'); if (m !== null) mudaStatus(uid, b.dataset.a === 'sus' ? 'suspenso' : 'recusado', m); }
    else if (b.dataset.a === 'pw') { try { await sendPasswordResetEmail(auth, a.email); toast('Link de senha enviado para ' + a.email); } catch (x) { toast(errMsg(x), true); } }
    else if (b.dataset.a === 'del') {
      if (!await confirmBox(`Excluir o cadastro de <b>${esc(a.nome)}</b>? O site e as mensagens recebidas também serão apagados. (A conta de login continua existindo no Firebase Authentication; remova-a lá se necessário.)`, 'Excluir')) return;
      try { if (a.siteSlug) { for (const d of (await getDocs(collection(db, 'sites', a.siteSlug, 'mensagens'))).docs) await deleteDoc(d.ref); await deleteDoc(doc(db, 'sites', a.siteSlug)); } await deleteDoc(doc(db, 'associados', uid)); toast('Cadastro excluído.'); } catch (x) { toast(errMsg(x), true); }
    }
  };
  draw(); return { refresh: draw };
}
function formComunicado(c) {
  const n = !c;
  openModal(`<h2>${n ? 'Novo comunicado' : 'Editar comunicado'}</h2><form id="cf">
    <div class="row2"><div class="field"><label>Tipo</label><select name="tipo">${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${(c?.tipo || 'aviso') === k ? 'selected' : ''}>${v[0]} ${v[1]}</option>`).join('')}</select></div><div class="field"><label>Expira em (opcional)</label><input type="date" name="exp" value="${esc(c?.expiraEm)}"></div></div>
    <div class="field"><label>Título</label><input name="t" required maxlength="140" value="${esc(c?.titulo)}"></div>
    <div class="field"><label>Texto</label><textarea name="x" required maxlength="3000">${esc(c?.texto)}</textarea></div>
    <div class="row2"><div class="field"><label>Link (opcional)</label><input name="l" maxlength="300" value="${esc(c?.link)}" placeholder="https://…"></div><div class="field"><label>Texto do link</label><input name="lt" maxlength="40" value="${esc(c?.linkTexto)}" placeholder="Saiba mais"></div></div>
    <label class="check"><input type="checkbox" name="popup" ${c?.popup ? 'checked' : ''}><span>Exibir em <b style="color:var(--cream)">pop-up</b> quando o associado entrar ou criar a conta</span></label>
    <label class="check"><input type="checkbox" name="pub" ${c ? (c.publico ? 'checked' : '') : 'checked'}><span>Mostrar na <b style="color:var(--cream)">página inicial</b> para visitantes (desmarcado: só para quem fez login)</span></label>
    <label class="check"><input type="checkbox" name="fix" ${c?.fixado ? 'checked' : ''}><span>Fixar no topo do quadro</span></label>
    <label class="check"><input type="checkbox" name="ativo" ${c ? (c.ativo !== false ? 'checked' : '') : 'checked'}><span>Ativo (visível)</span></label>
    <p class="msg-err" id="ce"></p><div class="acts"><button type="button" class="btn ghost sm" data-no>Cancelar</button><button class="btn sm">${n ? 'Publicar' : 'Salvar'}</button></div></form>`,
  (m, close) => {
    $('[data-no]', m).onclick = close;
    $('#cf', m).onsubmit = async e => { e.preventDefault(); const f = e.target;
      try {
        if (f.l.value.trim() && !safeUrl(f.l.value.trim())) throw new Error('O link precisa começar com https://');
        const d = { tipo: f.tipo.value, titulo: f.t.value.trim(), texto: f.x.value.trim(), link: f.l.value.trim(), linkTexto: f.lt.value.trim(), expiraEm: f.exp.value, popup: f.popup.checked, publico: f.pub.checked, fixado: f.fix.checked, ativo: f.ativo.checked, atualizadoAt: serverTimestamp() };
        if (n) await addDoc(collection(db, 'comunicados'), { ...d, criadoAt: serverTimestamp() }); else await updateDoc(doc(db, 'comunicados', c.id), d);
        close(); toast(n ? 'Comunicado publicado.' : 'Comunicado atualizado.');
      } catch (x) { $('#ce', m).textContent = errMsg(x); } };
  });
}
function viewAdminCom(main) {
  main.innerHTML = `<div class="wrap pad"><div class="page-h"><div><div class="eyebrow">Comunicação</div><h1><em>Comunicados</em></h1><p>Avisos, alertas, publicações e atualizações exibidos na página inicial e no acesso dos associados. Os marcados como pop-up aparecem ao entrar ou criar a conta.</p></div><button class="btn" id="nv">＋ Novo comunicado</button></div><div id="ls" class="board"></div></div>`;
  const draw = () => {
    const l = [...S.com].sort((a, b) => (b.fixado ? 1 : 0) - (a.fixado ? 1 : 0) || ms(b.criadoAt) - ms(a.criadoAt));
    $('#ls', main).innerHTML = l.length ? l.map(c => `<div>${avisoHtml(c, true)}<div style="display:flex;gap:.4rem;margin:.4rem 0 .6rem;flex-wrap:wrap"><button class="btn ghost sm" data-e="${c.id}">Editar</button><button class="btn ghost sm" data-t="${c.id}">${c.ativo === false ? 'Reativar' : 'Desativar'}</button><button class="btn danger sm" data-d="${c.id}">Excluir</button></div></div>`).join('') : '<div class="empty"><b>Nenhum comunicado</b>Clique em “Novo comunicado” para publicar o primeiro.</div>';
  };
  $('#nv', main).onclick = () => formComunicado(null);
  main.onclick = async e => { const b = e.target.closest('[data-e],[data-t],[data-d]'); if (!b) return; const id = b.dataset.e || b.dataset.t || b.dataset.d, c = S.com.find(x => x.id === id); if (!c) return;
    try { if (b.dataset.e) formComunicado(c); else if (b.dataset.t) await updateDoc(doc(db, 'comunicados', id), { ativo: c.ativo === false, atualizadoAt: serverTimestamp() }); else if (await confirmBox(`Excluir o comunicado “${esc(c.titulo)}”?`, 'Excluir')) { await deleteDoc(doc(db, 'comunicados', id)); toast('Excluído.'); } } catch (x) { toast(errMsg(x), true); } };
  draw(); return { refresh: draw };
}
function viewAdminAcessos(main) {
  main.innerHTML = `<div class="wrap pad"><div class="page-h"><div><div class="eyebrow">Atividade</div><h1><em>Acessos</em> ao portal</h1><p>Registro dos logins dos últimos 30 dias e associados online agora (atividade nos últimos 10 minutos).</p></div></div><div id="on"></div><div class="sec-t">Logins recentes</div><div class="list" id="ls"></div></div>`;
  const draw = () => {
    const on = S.associados.filter(online);
    $('#on', main).innerHTML = `<div class="pnl"><h3>Online agora (${on.length})</h3><div class="mini">${on.map(a => `<div><span><span class="on-dot"></span> ${esc(a.nome)}</span><small>${esc(a.email)}</small></div>`).join('') || '<div class="none">Ninguém online neste momento.</div>'}</div></div>`;
    const l = [...S.logins].sort((a, b) => ms(b.em) - ms(a.em)).slice(0, 200);
    $('#ls', main).innerHTML = l.length ? l.map(x => `<div class="item"><div class="main"><h3>${esc(x.nome)} ${x.tipo === 'admin' ? '<span class="chip s-purple">admin</span>' : ''}</h3><p>${esc(x.email)}</p></div><span style="font-size:.72rem;color:var(--muted)">${fmtDT(x.em)} · ${ago(x.em)}</span></div>`).join('') : '<div class="empty"><b>Sem registros</b></div>';
  };
  draw(); return { refresh: draw };
}
function viewAdminConfig(main) {
  const c = S.config;
  main.innerHTML = `<div class="wrap pad"><div class="page-h"><div><div class="eyebrow">Sistema</div><h1><em>Configurações</em></h1></div></div>
  <form class="card" id="cf" style="max-width:720px"><div class="field"><label>Título da página inicial</label><input name="ht" maxlength="140" value="${esc(c.heroTitulo)}"></div>
  <div class="field"><label>Texto de apresentação</label><textarea name="hx" maxlength="600">${esc(c.heroTexto)}</textarea></div>
  <div class="field"><label>E-mail de suporte (exibido no portal)</label><input name="se" type="email" maxlength="150" value="${esc(c.suporteEmail)}"></div>
  <div class="field"><label>Termo de aceite do cadastro</label><textarea name="tm" maxlength="800">${esc(c.termos)}</textarea></div>
  <label class="check"><input type="checkbox" name="auto" ${c.aprovacaoAuto ? 'checked' : ''}><span><b style="color:var(--cream)">Aprovação automática</b> — novos cadastros já entram como ativos (sem validação manual). Deixe desmarcado para aprovar um a um.</span></label>
  <p class="msg-err" id="ce"></p><button class="btn">Salvar configurações</button></form>
  <div class="card" style="max-width:720px;margin-top:1.2rem"><div class="eyebrow">Senha do administrador</div><p class="hint" style="margin-bottom:1rem">Se ainda usa a senha inicial de implantação, troque-a agora por uma senha forte: enviaremos um link para ${esc(S.user.email)}.</p><button class="btn ghost" id="pw">Enviar link para trocar a senha</button></div></div>`;
  $('#cf', main).onsubmit = async e => { e.preventDefault(); const f = e.target;
    try { const d = { heroTitulo: f.ht.value.trim(), heroTexto: f.hx.value.trim(), suporteEmail: f.se.value.trim(), termos: f.tm.value.trim(), aprovacaoAuto: f.auto.checked }; await setDoc(doc(db, 'config', 'portal'), d); S.config = { ...DEF, ...d }; toast('Configurações salvas.'); } catch (x) { $('#ce', main).textContent = errMsg(x); } };
  $('#pw', main).onclick = async () => { try { await sendPasswordResetEmail(auth, S.user.email); toast('Link enviado para ' + S.user.email); } catch (x) { toast(errMsg(x), true); } };
  return {};
}

/* ---------- rotas ---------- */
function route() {
  S.view?.destroy?.(); S.view = null;
  const [r, a] = location.hash.replace(/^#\/?/, '').split('/');
  if (r === 'a' && a) { S.view = viewSite(decodeURIComponent(a).toLowerCase()); return; }
  renderShell(); const main = $('#main'); window.scrollTo(0, 0);
  if ((r === 'entrar' || r === 'cadastro') && !S.user) S.view = viewAuth(main, r === 'cadastro' ? 'reg' : 'login');
  else if (r === 'entrar' || r === 'cadastro') location.replace(S.admin ? '#/admin' : '#/painel');
  else if (r === 'advogados') S.view = viewDirectory(main);
  else if (r === 'painel') {
    if (!S.user) return location.replace('#/entrar'); if (S.admin) return location.replace('#/admin');
    S.view = a === 'site' ? viewSiteEditor(main) : a === 'mensagens' ? viewMsgs(main) : a === 'perfil' ? viewPerfil(main) : viewPainel(main);
  } else if (r === 'admin') {
    if (!S.admin) return location.replace(S.user ? '#/painel' : '#/entrar');
    S.view = a === 'associados' ? viewAdminAssoc(main) : a === 'comunicados' ? viewAdminCom(main) : a === 'acessos' ? viewAdminAcessos(main) : a === 'config' ? viewAdminConfig(main) : viewAdminHome(main);
  } else S.view = viewHome(main);
  renderHeader();
}
window.addEventListener('hashchange', route);
function onData() { renderHeader(); S.view?.refresh?.(); }

/* ---------- sessão ---------- */
function publicListeners() {
  S.pubUnsub?.(); S.pubUnsub = onSnapshot(query(collection(db, 'sites'), where('publicado', '==', true), limit(100)), s => { S.dirSites = docs(s).sort((a, b) => ms(b.criadoAt) - ms(a.criadoAt)); onData(); }, e => console.warn('dir', e.code));
}
function attach(user) {
  const uid = user.uid;
  const comQ = S.admin ? collection(db, 'comunicados') : query(collection(db, 'comunicados'), where('ativo', '==', true));
  listen(comQ, s => { S.com = docs(s); S.comLoaded = true; if (S.popupPending) { S.popupPending = false; showPopups(); } onData(); });
  if (S.admin) {
    listen(collection(db, 'associados'), s => { S.associados = docs(s); onData(); });
    listen(collection(db, 'sites'), s => { S.sites = docs(s); onData(); });
    listen(query(collection(db, 'logins'), where('em', '>=', Timestamp.fromMillis(Date.now() - 30 * 864e5)), orderBy('em', 'desc'), limit(1500)), s => { S.logins = docs(s); onData(); });
  } else {
    let siteUnsub = null, msgUnsub = null, curSlug = '';
    listen(doc(db, 'associados', uid), s => {
      const prev = S.assoc?.status; S.assoc = s.exists() ? { id: s.id, ...s.data({ serverTimestamps: 'estimate' }) } : null;
      const slug = S.assoc?.siteSlug || '';
      if (slug !== curSlug) {
        curSlug = slug; siteUnsub?.(); msgUnsub?.(); S.site = null; S.msgs = [];
        if (slug) {
          siteUnsub = onSnapshot(doc(db, 'sites', slug), d => { S.site = d.exists() ? { id: d.id, ...d.data() } : null; onData(); }, () => {}); S.unsubs.push(() => siteUnsub?.());
          msgUnsub = onSnapshot(collection(db, 'sites', slug, 'mensagens'), m => { S.msgs = docs(m); onData(); }, () => {}); S.unsubs.push(() => msgUnsub?.());
        }
      }
      if (prev && prev !== S.assoc?.status && S.assoc?.status === 'ativo') toast('🎉 Seu cadastro foi aprovado! Crie o seu site em “Meu site”.');
      onData();
    });
    S.hb = setInterval(() => { if (document.visibilityState === 'visible' && S.assoc) updateDoc(doc(db, 'associados', uid), { visto: serverTimestamp() }).catch(() => {}); }, 5 * 60e3);
  }
}
async function boot() {
  try { const c = await getDoc(doc(db, 'config', 'portal')); if (c.exists()) S.config = { ...DEF, ...c.data() }; } catch { /* usa o padrão */ }
  publicListeners();
  onAuthStateChanged(auth, async user => {
    stopAll(); S.user = user; S.admin = false; S.assoc = null; S.site = null; S.msgs = []; S.associados = []; S.logins = []; S.sites = []; S.com = [];
    if (user) {
      S.admin = (user.email || '').toLowerCase() === ADMIN_EMAIL;
      try { if (!S.admin) await ensureAssoc(user); } catch (e) { console.warn('cadastro', e.code); toast(errMsg(e), true); }
      S.popupPending = await logAccess(user);
    } else {
      S.popupPending = false;
      listen(query(collection(db, 'comunicados'), where('ativo', '==', true), where('publico', '==', true)), s => { S.com = docs(s); onData(); });
    }
    if (user) attach(user);
    route();
  });
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#instBtn'); if (b) b.hidden = false; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
boot();
</script>
